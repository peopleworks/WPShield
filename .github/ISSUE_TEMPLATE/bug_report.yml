name: Bug report
description: Something in WPShield does not behave as documented
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **If this is an exploitable security vulnerability, stop and use
        [private vulnerability reporting](https://github.com/peopleworks/WPShield/security/advisories/new)
        instead.** A public issue tells an attacker before it tells a maintainer.

        If a rule flagged legitimate traffic, the
        [false positive report](https://github.com/peopleworks/WPShield/issues/new?template=false_positive.yml)
        template asks better questions than this one.

        Never paste credentials, cookies, authorization headers, WordPress nonces, tokens,
        full query strings or request bodies. Redact real hostnames.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      description: Where possible, quote the documentation or roadmap item that says so.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: >-
        Use synthetic data and placeholder hostnames such as wordpress-one.example. If the
        original request carried a query string, cookies or a body, describe their shape
        rather than reproducing them — the shape is what turns into a test case.
      placeholder: |
        1. Configure a site with ...
        2. Send `curl.exe -H "Host: wordpress-one.example" ...`
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output, redacted
      description: >-
        Gateway output, the request identifier, or the failing test name. Read what you are
        about to paste: a captured gateway log can carry hostnames, paths and upload file
        names. Remove credentials, cookies, authorization values, nonces, tokens, query
        strings and body content first, and replace real hostnames with
        wordpress-one.example.
      render: text
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        WPShield version or commit, .NET SDK version, operating system, and IIS version if
        it is involved. Describe the topology in placeholders — two sites on loopback ports —
        never real hostnames or real internal ports.
      render: text
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Before submitting
      options:
        - label: This is not an exploitable vulnerability.
          required: true
        - label: I removed secrets, real hostnames and sensitive request data.
          required: true
