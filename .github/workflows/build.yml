name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore WPShield.slnx
      - run: dotnet build WPShield.slnx --configuration Release --no-restore
      - run: dotnet test WPShield.slnx --configuration Release --no-build
