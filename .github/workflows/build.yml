name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore WPShield.slnx
      - run: dotnet build WPShield.slnx --configuration Release --no-restore
      - run: dotnet test WPShield.slnx --configuration Release --no-build

  # WPShield.Abstractions and WPShield.Core are required to stay free of ASP.NET Core,
  # YARP, IIS and Windows dependencies. That claim is only credible if it is verified,
  # so the platform-independent half of the solution is built and tested on Linux too.
  portable-core:
    name: Verify portable core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Test the platform-independent projects
        run: |
          for project in \
            tests/WPShield.Abstractions.Tests \
            tests/WPShield.Core.Tests \
            tests/WPShield.Rules.WordPress.Tests
          do
            dotnet test "$project" --configuration Release
          done

  # The operator-facing PowerShell scripts are not built by dotnet, so nothing above would notice
  # a syntax error, a non-ASCII byte that Windows PowerShell 5.1 cannot read, or a triage tool
  # whose copy of the gateway's rule vocabulary has drifted away from the gateway.
  verify-scripts:
    name: Verify PowerShell scripts (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse, encoding, read-only inventory, vocabulary drift, end-to-end run
        shell: pwsh
        run: ./scripts/Test-WPShieldScripts.ps1

      # The same checks again, under the interpreter these scripts are actually written for.
      #
      # PowerShell 7 accepting a script is not evidence that 5.1 will, and the two differ in ways
      # that matter here rather than in theory. The installer passed an empty string to sc.exe as a
      # value for password=; PowerShell 7 forwards it as "", Windows PowerShell 5.1 DROPS it, so
      # sc.exe saw a key with no value and rejected the whole command line with 1639. The install
      # threw at step 4 of 6 - after the service had been created with its LocalSystem default and
      # before the step that restricts the directories.
      #
      # Nothing here caught it, because running the suite under pwsh and merely PARSING under 5.1 is
      # not the same as running it under 5.1. Now it runs under both.
      - name: Run the same checks under Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/Test-WPShieldScripts.ps1

      - name: Parse under Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem ./scripts -Filter *.ps1 | ForEach-Object {
              $errors = $null
              $tokens = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                  $failed = $true
                  $errors | ForEach-Object {
                      Write-Host ("{0} line {1}: {2}" -f $_.Extent.File, $_.Extent.StartLineNumber, $_.Message)
                  }
              }
          }
          if ($failed) { exit 1 }
          Write-Host 'All scripts parse under Windows PowerShell 5.1.'

  format:
    name: Verify formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore WPShield.slnx
      - run: dotnet format WPShield.slnx --verify-no-changes --no-restore
