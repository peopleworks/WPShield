name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore WPShield.slnx
      - run: dotnet build WPShield.slnx --configuration Release --no-restore
      - run: dotnet test WPShield.slnx --configuration Release --no-build

  # WPShield.Abstractions and WPShield.Core are required to stay free of ASP.NET Core,
  # YARP, IIS and Windows dependencies. That claim is only credible if it is verified,
  # so the platform-independent half of the solution is built and tested on Linux too.
  portable-core:
    name: Verify portable core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Test the platform-independent projects
        run: |
          for project in \
            tests/WPShield.Abstractions.Tests \
            tests/WPShield.Core.Tests \
            tests/WPShield.Rules.WordPress.Tests
          do
            dotnet test "$project" --configuration Release
          done

  format:
    name: Verify formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore WPShield.slnx
      - run: dotnet format WPShield.slnx --verify-no-changes --no-restore
