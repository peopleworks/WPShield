<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"
     role="img" aria-labelledby="wps-hero-title wps-hero-desc"
     font-family="Segoe UI, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">
  <title id="wps-hero-title">How WPShield scores a disguised upload against a benign one</title>
  <desc id="wps-hero-desc">Two uploads run through the same four stages. A file named holiday-photo.jpg is normalized unchanged, matches no rule, scores 0 and is allowed through to the site's IIS destination. A file named invoice.php.jpg is normalized to the same name, but every extension segment is examined rather than only the last, so WP-UPLOAD-001 reports an embedded .php extension for 50 points and WP-UPLOAD-002 reports an executable extension hidden behind a presented .jpg for 30 points. Neither finding blocks on its own; together they total 80, which reaches the default block threshold of 80, and in Block mode the request is blocked without being forwarded or stored. The verdict is shown as rule identifiers, individual scores and the evidence keys that produced them. A side panel lists three names that all normalize to shell.php: shell.php with a trailing dot, shell.php with a trailing space, and shell.php::$DATA. A closing strip states that Monitor is the default mode, in which the same score is recorded and the request is still forwarded, and that Block is per-site and explicit.</desc>

  <defs>
    <!-- One marker per colour: context-stroke is unsupported by librsvg and resvg, so the
         head colour is hard-coded. Ids are namespaced per figure so two inlined figures on
         the GitHub Pages page cannot capture each other's arrowheads. -->
    <marker id="wps-hero-arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3A424E"/>
    </marker>
    <marker id="wps-hero-arrow-block" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#F97066"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="700" rx="16" fill="#0A0D12"/>
  <rect x="0.75" y="0.75" width="1198.5" height="698.5" rx="16" fill="none" stroke="#2A313B" stroke-width="1.5"/>

  <!-- ============================ header ============================ -->
  <text x="600" y="62" text-anchor="middle" font-size="40" font-weight="800" letter-spacing="2.5" fill="#E8EDF3">WPShield</text>
  <text x="600" y="94" text-anchor="middle" font-size="15.5" fill="#97A3B2">The name that reaches disk is not the name that was uploaded.</text>
  <text x="600" y="118" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#A78BFA">WPSHIELD NORMALIZES IT THE WAY WINDOWS WILL, THEN NAMES THE RULE THAT OBJECTED</text>

  <!-- ======================= column captions ======================== -->
  <g font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#7D8998">
    <text x="56" y="158">1 &#183; WHAT THE CLIENT SENT</text>
    <text x="376" y="158">2 &#183; WHAT WINDOWS WILL WRITE</text>
    <text x="672" y="158">3 &#183; WHICH RULES MATCHED</text>
    <text x="992" y="158">4 &#183; VERDICT</text>
  </g>

  <!-- =========================== lane A =========================== -->
  <rect x="40" y="172" width="1120" height="152" rx="14" fill="#161B22" stroke="#2A313B" stroke-width="1.5"/>

  <text x="56" y="212" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#7D8998">multipart filename</text>
  <rect x="56" y="232" width="272" height="32" rx="6" fill="#0D1117" stroke="#2A313B" stroke-width="1.5"/>
  <text x="70" y="252" font-family="Consolas, ui-monospace, Cascadia Mono, Menlo, monospace" font-size="13" fill="#E8EDF3">holiday-photo.jpg</text>

  <rect x="376" y="232" width="248" height="32" rx="6" fill="#0D1117" stroke="#2A313B" stroke-width="1.5"/>
  <text x="390" y="252" font-family="Consolas, ui-monospace, Cascadia Mono, Menlo, monospace" font-size="13" fill="#E8EDF3">holiday-photo.jpg</text>
  <text x="376" y="284" font-size="11" fill="#97A3B2">unchanged &#183; segments: [jpg]</text>

  <text x="672" y="242" font-size="12.5" font-weight="600" fill="#E8EDF3">No rule matched.</text>
  <text x="672" y="262" font-family="Consolas, ui-monospace, Cascadia Mono, Menlo, monospace" font-size="11.5" fill="#97A3B2">score 0 &#183; below observeThreshold 30</text>

  <rect x="992" y="232" width="140" height="32" rx="16" fill="#162E26" stroke="#4ADE80" stroke-width="1.5"/>
  <path d="M1034 248 l5 6 l10 -13" fill="none" stroke="#4ADE80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1057" y="252" font-size="13" font-weight="700" letter-spacing="0.8" fill="#4ADE80">ALLOW</text>
  <g text-anchor="middle" font-size="11" fill="#97A3B2">
    <text x="1062" y="284">forwarded to the site&#8217;s</text>
    <text x="1062" y="302">IIS destination</text>
  </g>

  <line x1="336" y1="248" x2="370" y2="248" stroke="#3A424E" stroke-width="2.5" marker-end="url(#wps-hero-arrow-neutral)"/>
  <line x1="632" y1="248" x2="666" y2="248" stroke="#3A424E" stroke-width="2.5" marker-end="url(#wps-hero-arrow-neutral)"/>
  <line x1="960" y1="248" x2="986" y2="248" stroke="#3A424E" stroke-width="2.5" marker-end="url(#wps-hero-arrow-neutral)"/>

  <!-- =========================== lane B =========================== -->
  <rect x="40" y="340" width="1120" height="222" rx="14" fill="#2E1E22" stroke="#F97066" stroke-width="2"/>

  <rect x="56" y="376" width="272" height="32" rx="6" fill="#0D1117" stroke="#F97066" stroke-width="1.5"/>
  <text x="70" y="396" font-family="Consolas, ui-monospace, Cascadia Mono, Menlo, monospace" font-size="13" fill="#F97066">invoice.php.jpg</text>
  <text x="56" y="428" font-size="11" fill="#97A3B2">presents itself as an image</text>

  <text x="56" y="452" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#7D8998">ALSO NORMALIZED TO shell.php</text>
  <g font-family="Consolas, ui-monospace, Cascadia Mono, Menlo, monospace" font-size="11" fill="#7D8998">
    <text x="56" y="472">shell.php.</text>
    <text x="56" y="490">shell.php</text>
    <text x="56" y="508">shell.php::$DATA</text>
  </g>
  <g font-size="10.5" fill="#7D8998">
    <text x="176" y="472">trailing dot</text>
    <text x="176" y="490">trailing space</text>
    <text x="176" y="508">NTFS stream suffix</text>
  </g>

  <rect x="376" y="376" width="248" height="32" rx="6" fill="#0D1117" stroke="#F97066" stroke-width="1.5"/>
  <text x="390" y="396" font-family="Consolas, ui-monospace, Cascadia Mono, Menlo, monospace" font-size="13" fill="#F97066">invoice.php.jpg</text>
  <rect x="376" y="424" width="54" height="22" rx="4" fill="#0D1117" stroke="#F97066" stroke-width="1.5"/>
  <text x="403" y="439" text-anchor="middle" font-family="Consolas, ui-monospace, Cascadia Mono, Menlo, monospace" font-size="12" fill="#F97066">.php</text>
  <rect x="438" y="424" width="54" height="22" rx="4" fill="#0D1117" stroke="#2A313B" stroke-width="1.5"/>
  <text x="465" y="439" text-anchor="middle" font-family="Consolas, ui-monospace, Cascadia Mono, Menlo, monospace" font-size="12" fill="#97A3B2">.jpg</text>
  <text x="376" y="472" font-size="11" fill="#97A3B2">every segment is examined, not only the last</text>

  <!-- evidence card: machine output, inverted in both themes -->
  <rect x="672" y="358" width="280" height="178" rx="10" fill="#0A0E14" stroke="#2A313B" stroke-width="1"/>
  <g font-family="Consolas, ui-monospace, Cascadia Mono, Menlo, monospace" font-size="12" fill="#E8EDF3">
    <text x="692" y="386">WP-UPLOAD-001</text>
    <text x="936" y="386" text-anchor="end">+50</text>
    <text x="692" y="432">WP-UPLOAD-002</text>
    <text x="936" y="432" text-anchor="end">+30</text>
  </g>
  <g font-family="Consolas, ui-monospace, Cascadia Mono, Menlo, monospace" font-size="10.5" fill="#8794A4">
    <text x="692" y="404">extension=.php position=embedded</text>
    <text x="692" y="450">executableExtension=.php</text>
    <text x="692" y="468">presentedExtension=.jpg</text>
    <text x="936" y="528" text-anchor="end">&gt;= blockThreshold 80</text>
  </g>
  <line x1="692" y1="490" x2="936" y2="490" stroke="#232A34" stroke-width="1"/>
  <text x="692" y="510" font-family="Consolas, ui-monospace, Cascadia Mono, Menlo, monospace" font-size="12" fill="#8794A4">score</text>
  <text x="936" y="510" text-anchor="end" font-family="Consolas, ui-monospace, Cascadia Mono, Menlo, monospace" font-size="14" font-weight="700" fill="#F97066">80</text>

  <rect x="992" y="376" width="140" height="32" rx="16" fill="#0D1117" stroke="#F97066" stroke-width="2"/>
  <path d="M1034 385 L1048 399 M1048 385 L1034 399" fill="none" stroke="#F97066" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1056" y="396" font-size="13" font-weight="700" letter-spacing="0.8" fill="#F97066">BLOCK</text>
  <text x="1062" y="428" text-anchor="middle" font-size="11" font-weight="600" fill="#F97066">not forwarded, not stored</text>

  <text x="56" y="552" font-size="13" font-weight="700" fill="#E8EDF3">Neither finding blocks on its own. 50 + 30 is the design.</text>

  <line x1="336" y1="392" x2="370" y2="392" stroke="#F97066" stroke-width="2.5" marker-end="url(#wps-hero-arrow-block)"/>
  <line x1="632" y1="392" x2="666" y2="392" stroke="#F97066" stroke-width="2.5" marker-end="url(#wps-hero-arrow-block)"/>
  <line x1="960" y1="392" x2="986" y2="392" stroke="#F97066" stroke-width="2.5" marker-end="url(#wps-hero-arrow-block)"/>

  <!-- ======================== verdict strip ======================== -->
  <rect x="40" y="578" width="1120" height="58" rx="14" fill="#232237" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="600" y="600" text-anchor="middle" font-size="14" font-weight="600" fill="#E8EDF3">Every verdict is a rule ID, a score, and the evidence that produced it.</text>
  <text x="600" y="621" text-anchor="middle" font-size="12" fill="#97A3B2">Monitor is the default: the same score is recorded and the request is forwarded. Block is per-site and explicit.</text>

  <!-- ============================ footer ============================ -->
  <text x="600" y="660" text-anchor="middle" font-family="Consolas, ui-monospace, Cascadia Mono, Menlo, monospace" font-size="13" font-weight="700" fill="#E8EDF3">github.com/peopleworks/WPShield</text>
  <text x="600" y="682" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#7D8998">.NET 10 &#183; WINDOWS SERVER + IIS &#183; MIT &#183; RESEARCH PREVIEW &#183; PEOPLEWORKS</text>
</svg>
