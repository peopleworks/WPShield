  <line x1="368" y1="241" x2="844" y2="241" stroke="#3A424E" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="844" y="353" text-anchor="end" font-size="10.5" fill="#8794A4">WP-PATH-002 matches dist, build, _next, node_modules. Nothing in it is WordPress but the prefix.</text>

  <!-- ============================ closing strip ============================ -->
  <rect x="36" y="384" width="828" height="80" rx="14" fill="#232237" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="60" y="412" font-size="13.5" fill="#E8EDF3">Eleven rules read uploads and request paths. <tspan font-weight="700">Ten of them fire on a site that has never run WordPress.</tspan></text>
  <text x="60" y="434" font-size="13.5" fill="#E8EDF3">None of them reads a dotfile, a stray backup, or an exposed admin path &#8212; the four rows in red above.</text>
  <text x="60" y="454" font-size="11" fill="#8794A4">The gap is coverage and packaging, not the rules being WordPress-only. ADR 0004, exit condition 1.</text>
</svg>
