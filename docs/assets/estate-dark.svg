<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"
     role="img" aria-labelledby="wps-estate-title wps-estate-desc"
     font-family="Segoe UI, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">
  <title id="wps-estate-title">What WPShield's rules reach on a sixty-six site Windows Server, and what they do not</title>
  <desc id="wps-estate-desc">A figure in two panels. The left panel shows the estate this project was built against as a grid of sixty-six squares: two are drawn in purple and labelled WordPress sites, and sixty-four are drawn in blue and labelled .NET applications. The right panel lists seven requests a scan sends to every one of those sites, each with the rule that answers it. Four are unanswered and marked in red with the words no rule reads this: GET /.env, GET /.git/config, GET /db-backup.sql and GET /admin. Three are answered and marked in green: GET /dist/shell.php is met by WP-PATH-002 scoring 100, a POST uploading invoice.php.jpg is met by WP-UPLOAD-001 and 002 scoring 80, and a POST uploading web.config is met by IIS-CONFIG-001 scoring 100. A note records that WP-PATH-002 matches dist, build, _next and node_modules, and that nothing in it is about WordPress except the prefix. A closing strip states that eleven rules read uploads and request paths, that ten of them fire on a site that has never run WordPress, and that none of them reads a dotfile, a stray backup or an exposed admin path.</desc>

  <rect x="0" y="0" width="900" height="500" rx="16" fill="#0D1117"/>
  <rect x="0.75" y="0.75" width="898.5" height="498.5" rx="16" fill="none" stroke="#2A313B" stroke-width="1.5"/>

  <text x="450" y="42" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.5" fill="#8794A4">SIXTY-SIX SITES ON ONE WINDOWS SERVER. THE SCAN GOES TO EVERY ONE.</text>

