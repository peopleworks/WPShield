  <rect x="36" y="70" width="286" height="294" rx="12" fill="#161B22" stroke="#2A313B" stroke-width="1.5"/>
  <text x="56" y="98" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#8794A4">THE ESTATE THIS WAS BUILT AGAINST</text>

